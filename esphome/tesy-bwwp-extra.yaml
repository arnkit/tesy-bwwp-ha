# =============================================================================
# TESY BWWP - additional entities (taken from the archived Node-RED flow, "on: false" there)
# Parameter registers (d/g/E/n/H/r/F), bits O10..O14 and unclear measurement/status values.
#
# WARNING: these extra entities are PARTLY NOT VERIFIED. The register -> parameter assignment
# is a hypothesis for many of them (marked "(?)", "(unclear)", "(undocumented)" in the names),
# and even the others were only checked against one unit. Compare with your own display
# before trusting a value. Verified and enabled by default are only the entities in tesy-bwwp.yaml.
#
# All are "disabled_by_default"; most are "diagnostic".
#
# NOTE: All registers are read by their Modbus address (like in the Node-RED flow);
# their position inside the frame does not matter.
# Do NOT include the whole file (RAM of the ESP8266!).
# Better: copy single entries and paste them into tesy-bwwp.yaml under binary_sensor: / sensor:.
# Including it as a package is prepared (commented out) in tesy-bwwp.yaml.
# Generated from archive/node-red-waveshare/flow.json (SENSORS list); names follow the TESY manual where known.
# =============================================================================
binary_sensor:
  - platform: template
    name: "Reg 2050.10 - O10 - Four-way or two-way valve (bit 10)"
    # Register 2050, bit 10
    disabled_by_default: true
    lambda: |-
      return tesy::bwwp.bit_set(2050, 10);

  - platform: template
    name: "Reg 2050.11 - O11 - Solar circulating pump (bit 11)"
    # Register 2050, bit 11
    disabled_by_default: true
    lambda: |-
      return tesy::bwwp.bit_set(2050, 11);

  - platform: template
    name: "Reg 2050.12 - O12 - Solar drain valve (bit 12)"
    # Register 2050, bit 12
    disabled_by_default: true
    lambda: |-
      return tesy::bwwp.bit_set(2050, 12);

  - platform: template
    name: "Reg 2050.13 - O13 - Fan high speed (bit 13)"
    # Register 2050, bit 13
    disabled_by_default: true
    lambda: |-
      return tesy::bwwp.bit_set(2050, 13);

  - platform: template
    name: "Reg 2050.14 - O14 - Fan low speed (bit 14)"
    # Register 2050, bit 14
    disabled_by_default: true
    lambda: |-
      return tesy::bwwp.bit_set(2050, 14);

  - platform: template
    name: "Reg 1120 - r17 - Restart based on TTT"
    # Register 1120, ON if value != 0
    disabled_by_default: true
    entity_category: diagnostic
    lambda: |-
      return tesy::bwwp.nonzero(1120);

  - platform: template
    name: "Reg 2015 - Device on (mirror of reg 1011)"
    # Register 2015, ON if value != 0
    icon: mdi:power
    disabled_by_default: true
    entity_category: diagnostic
    lambda: |-
      return tesy::bwwp.nonzero(2015);

  - platform: template
    name: "Reg 1143 - No vacation (0 on vacation change)"
    # Register 1143, ON if value != 0
    icon: mdi:island
    disabled_by_default: true
    entity_category: diagnostic
    lambda: |-
      return tesy::bwwp.nonzero(1143);

